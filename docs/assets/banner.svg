<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="60%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2433"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.6"/>

  <!-- Accent glow blobs -->
  <ellipse cx="120" cy="140" rx="180" ry="120" fill="#4f46e5" opacity="0.06"/>
  <ellipse cx="1080" cy="140" rx="160" ry="110" fill="#7c3aed" opacity="0.05"/>

  <!-- Icon: code magnifier -->
  <g transform="translate(64, 68)">
    <circle cx="28" cy="28" r="26" fill="#4f46e5" opacity="0.12"/>
    <circle cx="28" cy="28" r="26" fill="none" stroke="#4f46e5" stroke-width="2.5" opacity="0.8"/>
    <line x1="48" y1="48" x2="58" y2="58" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round"/>
    <text x="16" y="35" font-family="monospace" font-size="16" font-weight="700" fill="#818cf8">&lt;/&gt;</text>
  </g>

  <!-- testex wordmark -->
  <text x="64" y="155"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="68" font-weight="800" letter-spacing="-2"
        fill="url(#titleGrad)" filter="url(#glow)">testex</text>

  <!-- Tagline -->
  <text x="66" y="188"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="17" fill="#8b949e" letter-spacing="0.2">Local-first AI index for UI test IDs</text>

  <!-- Framework pills -->
  <g transform="translate(66, 208)">
    <rect x="0" y="0" width="60" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">React</text>

    <rect x="68" y="0" width="48" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="92" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">Vue</text>

    <rect x="124" y="0" width="58" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="153" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#fb923c" text-anchor="middle">Svelte</text>

    <rect x="190" y="0" width="66" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="223" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#f87171" text-anchor="middle">Angular</text>

    <rect x="264" y="0" width="92" height="22" rx="11" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="310" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#a3e635" text-anchor="middle">100% offline</text>
  </g>

  <!-- Divider -->
  <line x1="560" y1="40" x2="560" y2="240" stroke="#21262d" stroke-width="1.5"/>

  <!-- RIGHT SIDE: Terminal mockup -->
  <g transform="translate(596, 32)">
    <rect x="0" y="0" width="548" height="216" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="548" height="36" rx="10" fill="#161b22"/>
    <rect x="0" y="26" width="548" height="10" fill="#161b22"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="6" fill="#febc2e"/>
    <circle cx="56" cy="18" r="6" fill="#28c840"/>
    <!-- Title -->
    <text x="274" y="23" font-family="monospace" font-size="12" fill="#6e7681" text-anchor="middle">testex — search</text>

    <!-- Command -->
    <text x="20" y="64" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#57ab5a">$</text>
    <text x="34" y="64" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#cdd9e5"> testex search </text>
    <text x="168" y="64" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#79c0ff">"login form"</text>
    <rect x="258" y="51" width="8" height="16" fill="#cdd9e5" opacity="0.7"/>

    <line x1="20" y1="76" x2="528" y2="76" stroke="#21262d" stroke-width="1"/>

    <!-- Row 1 -->
    <circle cx="32" cy="103" r="5" fill="#57ab5a" opacity="0.9"/>
    <text x="48" y="108" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#cdd9e5">login-email-input</text>
    <text x="360" y="108" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#6e7681">LoginForm.tsx</text>
    <text x="495" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#57ab5a" text-anchor="middle">● high</text>

    <!-- Row 2 -->
    <circle cx="32" cy="126" r="5" fill="#57ab5a" opacity="0.9"/>
    <text x="48" y="131" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#cdd9e5">login-form</text>
    <text x="360" y="131" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#6e7681">LoginForm.tsx</text>
    <text x="495" y="131" font-family="system-ui, sans-serif" font-size="11" fill="#57ab5a" text-anchor="middle">● high</text>

    <!-- Row 3 -->
    <circle cx="32" cy="149" r="5" fill="#d29922" opacity="0.9"/>
    <text x="48" y="154" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#cdd9e5">login-submit-button</text>
    <text x="360" y="154" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#6e7681">LoginForm.tsx</text>
    <text x="495" y="154" font-family="system-ui, sans-serif" font-size="11" fill="#d29922" text-anchor="middle">◑ medium</text>

    <!-- Row 4 -->
    <circle cx="32" cy="172" r="5" fill="#57ab5a" opacity="0.9"/>
    <text x="48" y="177" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#cdd9e5">login-password-input</text>
    <text x="360" y="177" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#6e7681">LoginForm.tsx</text>
    <text x="495" y="177" font-family="system-ui, sans-serif" font-size="11" fill="#57ab5a" text-anchor="middle">● high</text>

    <!-- Footer -->
    <line x1="20" y1="190" x2="528" y2="190" stroke="#21262d" stroke-width="1"/>
    <text x="20" y="208" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#6e7681">4 results  ·  ONNX local embeddings  ·  &lt;1ms</text>
  </g>
</svg>
