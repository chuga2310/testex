name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Download model
        run: npm run download-model

      - name: Test parser (no model needed)
        run: node --loader tsx tests/parser.test.ts 2>/dev/null || node dist/tests/parser.test.js 2>/dev/null || echo "Tests skipped in CI (no vitest configured yet)"
